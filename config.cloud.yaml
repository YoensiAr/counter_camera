camera:
  type: browser
  source: 0
  name: navegador_remoto
  width: 640
  height: 480
  fps: 10
  realtime: true
  queue_size: 2
  reconnect_seconds: 1
  read_timeout_seconds: 5
  imx500_model: ""
  imx500_person_class: 0
  imx500_bbox_order: xy
  imx500_boxes_normalized: false
  imx500_preserve_aspect_ratio: true
  imx500_tensor_timeout_seconds: 15
  allow_cpu_fallback: true

detection:
  model: auto
  device: auto
  confidence: 0.10
  iou: 0.5
  image_size: 320
  inference_stride: 1
  max_detections: 100
  optical_flow_preview: true
  cpu_threads: 2

tracking:
  type: bytetrack
  high_threshold: 0.35
  low_threshold: 0.10
  new_threshold: 0.40
  match_threshold: 0.80
  max_lost_seconds: 2.5
  max_tracks: 512

line:
  p1: [0.10, 0.50]
  p2: [0.90, 0.50]
  entry_to: positive
  margin_px: 12
  confirmation_frames: 3
  cooldown_seconds: 1.0
  history_size: 32
  anchor: center
  roi: null

web:
  enabled: false
  host: 0.0.0.0
  port: 8080
  max_stream_clients: 3

storage:
  database: data/counter.sqlite3
  retention_days: 90
  timezone: America/Santo_Domingo
  log_directory: logs

recording:
  enabled: false
  directory: recordings
  segment_seconds: 300
  retention_days: 7
  max_total_mb: 2048

gui: false

# Se deja desactivado en el primer despliegue cloud porque los modelos de
# reconocimiento facial/corporal no vienen dentro del repositorio. Puedes
# activarlo después de ejecutar scripts/download_face_models.py y preparar OSNet.
visitors:
  enabled: false
  mode: hybrid
  window: calendar_day
  window_hours: 24
  detector_model: models/face_detection_yunet_2023mar.onnx
  recognizer_model: models/face_recognition_sface_2021dec.onnx
  key_file: data/visitors.key
  match_threshold: 0.50
  new_threshold: 0.35
  ambiguity_margin: 0.08
  detection_threshold: 0.90
  min_face_pixels: 48
  min_sharpness: 50.0
  min_samples: 2
  sample_interval_seconds: 0.3
  sample_ttl_seconds: 3.0
  pending_seconds: 8.0
  max_identities: 10000
  max_faces_per_frame: 8
  detection_max_side: 640
  body_model: models/osnet_x0_25_msmt17.onnx
  body_match_threshold: 0.85
  body_new_threshold: 0.55
  body_ambiguity_margin: 0.08
  body_consistency_threshold: 0.65
  body_min_samples: 3
  body_max_views: 6
  body_min_width: 32
  body_min_height: 96
  body_min_confidence: 0.45
  body_min_sharpness: 8.0
  body_max_overlap: 0.30
  continuity_gap_seconds: 0.8
  continuity_evidence_seconds: 3.0
  continuity_speed: 3.0
