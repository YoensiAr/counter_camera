[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-counter"
version = "3.0.1"
description = "Contador local de entradas y salidas con YOLO, tracking y Raspberry Pi IMX500"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
vision = ["ultralytics==8.4.146", "lap>=0.5.12,<0.6", "opencv-python>=4.10,<=4.11.0.86"]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[project.scripts]
camera-counter = "camera_counter.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-base.txt"]}

[tool.setuptools.packages.find]
include = ["camera_counter*"]

[tool.setuptools.package-data]
"camera_counter.web" = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requiere Ultralytics/PyTorch, sin cámara física"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.vercel]
entrypoint = "cloud_server:app"