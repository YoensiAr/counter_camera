# Copiar a config.yaml. Rutas relativas al directorio de este archivo.
camera:
  type: auto                  # auto | usb | csi | imx500 | video | rtsp | mock
  source: 0                   # Índice, ruta o URL; secretos: CAMERA_COUNTER_SOURCE
  name: entrada_principal     # Nombre guardado en SQLite; nunca se guarda la URL
  width: 640
  height: 480
  fps: 20
  realtime: true              # Pacing de videos y simulación
  queue_size: 2
  reconnect_seconds: 2
  read_timeout_seconds: 5
  imx500_model: ""            # Ejemplo: models/yolo11n.rpk. Vacío usa YOLO en el host
  imx500_person_class: 0
  imx500_bbox_order: xy       # Contrato YOLO exportado: x1,y1,x2,y2
  imx500_boxes_normalized: false # Exportador Ultralytics 8.4.146: coordenadas en píxeles del tensor
  imx500_preserve_aspect_ratio: true
  imx500_tensor_timeout_seconds: 15
  allow_cpu_fallback: true

detection:
  model: auto                 # models/yolo11n.pt; NCNN local compatible tiene prioridad en Pi
  device: auto                # auto | cpu | 0 (GPU CUDA) | dispositivo admitido por el backend
  confidence: 0.10            # Conserva detecciones débiles para la segunda asociación de ByteTrack
  iou: 0.5
  image_size: 320             # Múltiplo de 32; afecta YOLO en el host, no cambia el RPK
  inference_stride: 1         # Aumentar reduce carga y puede perder cruces rápidos
  max_detections: 100
  optical_flow_preview: true  # Solo visualización entre inferencias; no produce eventos
  cpu_threads: 2

tracking:
  type: bytetrack             # bytetrack | botsort (sin ReID)
  high_threshold: 0.35
  low_threshold: 0.10
  new_threshold: 0.40
  match_threshold: 0.80
  max_lost_seconds: 2.5
  max_tracks: 512

line:
  p1: [0.10, 0.50]            # Coordenadas normalizadas [x,y], origen arriba a la izquierda
  p2: [0.90, 0.50]
  entry_to: positive          # Horizontal izquierda->derecha: positive=abajo
  margin_px: 12
  confirmation_frames: 3     # Observaciones reales consecutivas, en ambos lados
  cooldown_seconds: 1.0       # Repetición de dirección; un retorno confirmado se registra inmediatamente
  history_size: 32
  anchor: center             # center | feet | head (punto geométrico, no detector de cabeza)
  roi: null                  # [x1,y1,x2,y2] normalizado; null usa toda la imagen

web:
  enabled: true
  host: 127.0.0.1             # Usar 0.0.0.0 para acceder desde otro equipo de la LAN
  port: 8080
  max_stream_clients: 3

storage:
  database: data/counter.sqlite3
  retention_days: 90
  timezone: America/Santo_Domingo
  log_directory: logs

recording:
  enabled: false
  directory: recordings
  segment_seconds: 300
  retention_days: 7
  max_total_mb: 2048

gui: false                   # true necesita OpenCV con soporte de ventana

# Visitantes únicos: rostro y varias vistas corporales cifradas en este equipo.
# "calendar_day": una vez por día en storage.timezone.
# Una entrada y una salida por persona durante el plazo, también en panel/video.
# "hours": plazo fijo desde el primer cruce verificado; los regresos no lo prolongan.
visitors:
  enabled: true
  mode: hybrid               # hybrid | face (compatibilidad facial)
  window: calendar_day
  window_hours: 24
  detector_model: models/face_detection_yunet_2023mar.onnx
  recognizer_model: models/face_recognition_sface_2021dec.onnx
  key_file: data/visitors.key
  match_threshold: 0.50
  new_threshold: 0.35
  ambiguity_margin: 0.08
  detection_threshold: 0.90
  min_face_pixels: 48
  min_sharpness: 50.0
  min_samples: 2
  sample_interval_seconds: 0.3
  sample_ttl_seconds: 3.0
  pending_seconds: 8.0
  max_identities: 10000
  max_faces_per_frame: 8
  detection_max_side: 640
  body_model: models/osnet_x0_25_msmt17.onnx
  body_match_threshold: 0.85   # Comparar con negativos antes de reducirlo
  body_new_threshold: 0.55     # Entre ambos umbrales: esperar evidencia
  body_ambiguity_margin: 0.08
  body_consistency_threshold: 0.65
  body_min_samples: 3
  body_max_views: 6
  body_min_width: 32
  body_min_height: 96
  body_min_confidence: 0.45
  body_min_sharpness: 8.0
  body_max_overlap: 0.30
  continuity_gap_seconds: 0.8
  continuity_evidence_seconds: 3.0
  continuity_speed: 3.0        # Alturas corporales por segundo + tolerancia espacial
